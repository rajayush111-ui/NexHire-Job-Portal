# MongoDB Configuration (database jobportaldb; collection "users" is set on @Document)
# Ensure the MongoDB Windows service is running (services.msc -> MongoDB) or start mongod.
# Replace with Atlas if needed: mongodb+srv://<username>:<password>@cluster.mongodb.net/jobportaldb
spring.data.mongodb.uri=mongodb://localhost:27017/jobportaldb
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jobportal.app.jwtSecret=SecretKeyToGenJWTsSecurelyMustBeAtLeast64CharactersLongToAvoidSecurityExceptions
jobportal.app.jwtExpirationMs=86400000

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.security=INFO
